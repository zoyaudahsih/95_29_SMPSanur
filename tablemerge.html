<!DOCTYPE html>
<html>
    <head>
        <title>Table Merge</title>
        <link rel="stylesheet" href="tablemerge.css">
    </head>
    <body>

    <table>
    <tr>
        <td rowspan="3">1</td>
        <td colspan="2">2</td>
        <td colspan="2">3</td>
        <td rowspan="4">4</td>
        <td rowspan="4">5</td>
        <td rowspan="2">6</td>
        <td rowspan="6">7</td>
    </tr>

    <tr>
        <td>8</td>
        <td>9</td>
        <td colspan="2">10</td>
    </tr>

    <tr>
        <td>11</td>
        <td>12</td>
        <td>13</td>
        <td>14</td>
        <td rowspan="3">15</td>
    </tr>

    <tr>
        <td colspan="5">16</td>
    </tr>

    <tr>
        <td rowspan="2">17</td>
        <td colspan="2">18</td>
        <td rowspan="2">19</td>
        <td colspan="3">20</td>
    </tr>

    <tr>
        <td>21</td>
        <td>22</td>
        <td colspan="4">23</td>
    </tr>
</table>
</html>
