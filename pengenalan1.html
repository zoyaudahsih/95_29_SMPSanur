<!DOCTYPE html>
<html>
    <head>
        <title> Pengenalan HTML dan CSS </title>
    </head>
    <body background="abstract-bright-gradient-background-minimal-style_1017-51545.avif">
        <!-- property utk membuat warna pada background : bgcolor="blue" 
         property untuk membuat background gambar : background="nama file gambar"-->
        <!-- body utk isi web -->
         <!-- tag utk buat paragraf : <p>  </p> -->
          <p>ini adalah sebuah paragraf</p>
          <p>ini adalah paragraf kedua</p>
          <p>ini adalah paragraf ketiga</p>

          <u>ini underlined</u>
          <i>ini italic</i>

          <p><font color="red" size="12"> ini adalah paragraf </font></p>
          <!-- tag utk membuat judul/heading : <h1> </h1> . . . <h6> </h6> -->
           <h1>ini heading paling besar</h1>
           <h6>ini heading paling kecil</h6>
    </body>
